<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MonoDiary - 極簡時光</title>

    <link rel="manifest" href="manifest.json">

    <style>
        /* 極簡灰色調與大圓角設計 */
        :root {
            --bg-color: #f4f4f4;        
            --border-color: #e0e0e0;   
            --card-color: #ffffff;      
            --primary-text: #212121;    
            --secondary-text: #616161;  
            --hint-text: #9e9e9e;       
            --acc-grey: #424242;       
            --acc-grey-hover: #000000;  
            
            --radius-large: 24px;
            --radius-medium: 16px;
            --radius-small: 8px;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            margin: 0;
            padding: 20px 14px 80px 14px; 
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-x: none; 
        }

        @media (min-width: 768px) {
            body { padding: 40px 20px 100px 20px; }
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }
        @media (min-width: 768px) {
            header { margin-bottom: 40px; }
        }

        h1 {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--acc-grey);
            margin: 0;
            text-transform: uppercase;
        }
        @media (min-width: 768px) {
            h1 { font-size: 28px; }
        }

        /* 工具列與篩選區 */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }
        @media (min-width: 520px) {
            .toolbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding-bottom: 20px;
                margin-bottom: 30px;
            }
        }

        .filter-group, .action-group {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        @media (min-width: 520px) {
            .filter-group, .action-group { width: auto; }
        }

        .filter-group select { flex: 1; }
        @media (min-width: 520px) { .filter-group select { flex: none; } }

        .action-group .btn { flex: 1; text-align: center; }
        @media (min-width: 520px) { .action-group .btn { flex: none; } }

        select, input[type="date"] {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background-color: var(--card-color);
            border-radius: var(--radius-medium);
            font-size: 14px;
            color: var(--secondary-text);
            outline: none;
        }

        /* 按鈕樣式 */
        .btn {
            padding: 12px 20px;
            font-size: 13px;
            letter-spacing: 1px;
            border-radius: var(--radius-medium);
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            font-weight: 500;
        }
        .btn-acc { background: var(--acc-grey); color: white; }
        .btn-acc:hover { background: var(--acc-grey-hover); }
        .btn-sec { background: transparent; color: var(--secondary-text); border-color: var(--border-color); }
        .btn-sec:hover { background: var(--border-color); color: var(--primary-text); }
        .btn-danger { background: transparent; color: #e57373; border-color: #ffcccc; }
        .btn-danger:hover { background: #ffebee; color: #d32f2f; }

        textarea {
            width: 100%;
            height: 140px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--secondary-text);
            resize: none;
            box-sizing: border-box;
            outline: none;
            background: #fafafa;
            transition: all 0.2s;
        }
        textarea:focus { background: var(--card-color); border-color: var(--acc-grey); }

        /* 右下角懸浮 + 按鈕 */
        .fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 56px;
            height: 56px;
            background-color: var(--acc-grey);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            z-index: 999;
            border: none;
            outline: none;
        }
        .fab:hover {
            background-color: var(--acc-grey-hover);
            transform: scale(1.05);
        }
        @media (min-width: 768px) {
            .fab { right: 40px; bottom: 40px; width: 64px; height: 64px; font-size: 32px; }
        }

        /* 日記列表排版與滑動動畫 */
        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: opacity 0.2s ease, transform 0.2s ease;
            opacity: 1;
            transform: translateX(0);
            /* 電腦版加上游標暗示可以拖拽 */
            cursor: grab;
        }
        .diary-list:active {
            cursor: grabbing;
        }
        
        .diary-list.fade-out {
            opacity: 0;
        }

        .diary-item {
            background: var(--card-color);
            border-radius: var(--radius-large);
            border: 1px solid transparent;
            display: flex;
            flex-direction: row; 
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            user-select: none;
            -webkit-user-select: none;
        }
        .diary-item:hover {
            border-color: var(--border-color);
            transform: translateY(-2px);
        }

        /* 左側日期欄 */
        .diary-left {
            width: 75px; 
            background: #fafafa;
            border-right: 1px solid var(--border-color);
            padding: 22px 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        @media (min-width: 576px) {
            .diary-left { width: 100px; padding: 30px 10px; }
        }
        
        .diary-item-date { font-size: 18px; font-weight: 400; color: var(--primary-text); }
        .diary-item-year { font-size: 11px; color: var(--hint-text); margin-top: 3px; letter-spacing: 0.5px; }
        
        @media (min-width: 576px) {
            .diary-item-date { font-size: 22px; font-weight: 300; }
            .diary-item-year { font-size: 11px; margin-top: 5px; letter-spacing: 1px; }
        }

        /* 右側內容欄 */
        .diary-right {
            padding: 20px;
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        @media (min-width: 576px) {
            .diary-right { padding: 25px 30px; }
        }
        
        .diary-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--primary-text);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (min-width: 576px) {
            .diary-title { font-size: 17px; margin-bottom: 10px; }
        }
        
        .diary-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--secondary-text);
            white-space: pre-wrap;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 44.8px; 
        }

        /* 彈窗基本樣式 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            justify-content: center;
            align-items: flex-end; 
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }
        @media (min-width: 576px) {
            .modal { align-items: center; }
        }
        
        .modal-content {
            background: var(--card-color);
            padding: 24px;
            border-radius: var(--radius-large) var(--radius-large) 0 0;
            width: 100%;
            max-height: 85vh;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            animation: slideUpMobile 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-sizing: border-box;
        }
        @media (min-width: 576px) {
            .modal-content {
                border-radius: var(--radius-large);
                width: 90%;
                max-width: 580px;
                max-height: 80vh;
                box-shadow: 0 20px 50px rgba(0,0,0,0.08);
                animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpMobile { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(20px); } to { transform: translateY(0); } }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 20px;
            padding-right: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .view-date { font-size: 12px; color: var(--hint-text); letter-spacing: 1px; margin-bottom: 8px; text-transform: uppercase; }
        .view-title { font-size: 18px; font-weight: 500; color: var(--primary-text); margin-bottom: 16px; line-height: 1.4; }
        .view-text { font-size: 15px; line-height: 1.8; color: var(--secondary-text); white-space: pre-wrap; }

        .modal-edit-field { display: none; width: 100%; box-sizing: border-box; }
        .modal-textarea { height: 220px; background: #fafafa; margin-top: 12px; }

        /* 回收桶內部列表樣式 */
        .trash-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 45vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .trash-item {
            padding: 16px;
            background: #fafafa;
            border-radius: var(--radius-medium);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }
        @media (min-width: 480px) {
            .trash-item { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        
        .trash-info { overflow: hidden; width: 100%; }
        .trash-title { font-size: 14px; font-weight: 500; color: var(--primary-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .trash-date { font-size: 11px; color: var(--hint-text); margin-top: 2px; }

        .trash-actions {
            display: flex;
            gap: 16px;
            width: 100%;
            justify-content: flex-end;
            border-top: 1px solid #eee;
            padding-top: 6px;
        }
        @media (min-width: 480px) {
            .trash-actions { width: auto; border-top: none; padding-top: 0; }
        }
        
        .action-link {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            background: none;
            border: none;
            text-transform: uppercase;
            padding: 8px 4px;
        }
        .link-delete { color: #e57373; }
        .link-delete:hover { color: #d32f2f; }

        .no-data {
            text-align: center;
            color: var(--hint-text);
            font-size: 13px;
            letter-spacing: 1px;
            padding: 50px 20px;
            background: var(--card-color);
            border-radius: var(--radius-large);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MonoDiary</h1>
        </header>

        <!-- 總覽與篩選工具列 -->
        <div class="toolbar">
            <div class="filter-group">
                <select id="filterYear" onchange="loadDiaries()">
                    <option value="all">YEARS</option>
                </select>
                <select id="filterMonth" onchange="loadDiaries()">
                    <option value="all">MONTHS</option>
                    <option value="01">01</option><option value="02">02</option>
                    <option value="03">03</option><option value="04">04</option>
                    <option value="05">05</option><option value="06">06</option>
                    <option value="07">07</option><option value="08">08</option>
                    <option value="09">09</option><option value="10">10</option>
                    <option value="11">11</option><option value="12">12</option>
                </select>
            </div>
            <div class="action-group">
                <button class="btn btn-sec" onclick="openTrashModal()">回收桶 (<span id="trashCount">0</span>)</button>
                <button class="btn btn-sec" onclick="exportToExcel()">匯出</button>
            </div>
        </div>

        <!-- 日記列表 -->
        <div id="diaryList" class="diary-list"></div>
    </div>

    <!-- 右下角固定的新增懸浮按鈕 -->
    <button class="fab" onclick="openWriterModal()">+</button>

    <!-- 新增日記專用彈窗 -->
    <div id="writerModal" class="modal" onclick="closeModal('writerModal', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-body">
                <div class="view-date" style="margin-bottom: 5px;">NEW ENTRY DATE</div>
                <input type="date" id="diaryDate" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">
                <textarea id="diaryText" style="height: 250px;" placeholder="第一行是標題...&#10;第二行開始是內容。"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button class="btn btn-sec" onclick="closeModal('writerModal')">取消</button>
                <button class="btn btn-acc" onclick="saveNewDiary()">儲存</button>
            </div>
        </div>
    </div>

    <!-- 閱讀/編輯日記彈窗 -->
    <div id="diaryModal" class="modal" onclick="closeModal('diaryModal', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-body">
                <!-- 閱讀模式區 -->
                <div id="modeView">
                    <div id="viewDate" class="view-date"></div>
                    <div id="viewTitle" class="view-title"></div>
                    <div id="viewText" class="view-text"></div>
                </div>
                <!-- 編輯模式區 -->
                <div id="modeEdit" style="display: none;">
                    <div class="view-date" style="margin-bottom: 5px;">EDIT ENTRY DATE</div>
                    <input type="date" id="editModalDate" class="modal-edit-field" style="display: block;">
                    <textarea id="editModalText" class="modal-edit-field modal-textarea" style="display: block;" placeholder="編輯標題..."></textarea>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <div id="viewActions" style="display: flex; gap: 10px; width: 100%; justify-content: space-between;">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-sec" onclick="switchModalToEdit()">編輯</button>
                        <button class="btn btn-danger" onclick="handleModalDelete()">刪除</button>
                    </div>
                    <button class="btn btn-acc" onclick="closeModal('diaryModal')">關閉</button>
                </div>
                <div id="editActions" style="display: none; gap: 10px; width: 100%; justify-content: flex-end;">
                    <button class="btn btn-sec" onclick="switchModalToView()">取消</button>
                    <button class="btn btn-acc" onclick="handleModalUpdate()">更新</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 回收桶彈窗 -->
    <div id="trashModal" class="modal" onclick="closeModal('trashModal', event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-body">
                <div class="view-title" style="margin-bottom: 16px;">回收桶</div>
                <div id="trashList" class="trash-list"></div>
            </div>
            <div style="display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button class="btn btn-acc" onclick="closeModal('trashModal')">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let targetDiaryId = null;
        
        // 拖拽手勢通用變數 (支援手機觸控與電腦滑鼠)
        let dragStartX = 0;
        let dragStartY = 0;
        let isMouseDown = false;
        let hasDragged = false; // 用於區分「點擊卡片」與「拖拽換月」

        document.addEventListener('DOMContentLoaded', () => {
            initYearFilter();
            const currentMonth = (new Date().getMonth() + 1).toString().padStart(2, '0');
            document.getElementById('filterMonth').value = currentMonth;
            
            loadDiaries();
            updateTrashCount();
            setupDragGestures();
        });

        function initYearFilter() {
            const yearSelect = document.getElementById('filterYear');
            const currentYear = new Date().getFullYear();
            for (let i = currentYear; i >= currentYear - 3; i--) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i;
                yearSelect.appendChild(opt);
            }
            yearSelect.value = currentYear;
        }

        // 🌟 同時綁定手機觸控 (Touch) 與電腦滑鼠 (Mouse) 左右拖拽事件
        function setupDragGestures() {
            const listContainer = document.getElementById('diaryList');

            // --- 手機觸控事件 ---
            listContainer.addEventListener('touchstart', (e) => {
                dragStartX = e.touches[0].clientX;
                dragStartY = e.touches[0].clientY;
            }, { passive: true });

            listContainer.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                handleDragEnd(endX, endY);
            }, { passive: true });


            // --- 電腦滑鼠事件 ---
            listContainer.addEventListener('mousedown', (e) => {
                // 排除點擊到按鈕或其他表單元件
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
                isMouseDown = true;
                hasDragged = false;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                // 如果移動距離超過 10px，判定為正在拖拽，防止觸發點擊開啟卡片
                if (Math.abs(e.clientX - dragStartX) > 10) {
                    hasDragged = true;
                }
            });

            window.addEventListener('mouseup', (e) => {
                if (!isMouseDown) return;
                isMouseDown = false;
                if (hasDragged) {
                    handleDragEnd(e.clientX, e.clientY);
                }
            });
        }

        // 處理拖拽結束後的判定邏輯
        function handleDragEnd(endX, endY) {
            const deltaX = endX - dragStartX;
            const deltaY = endY - dragStartY;

            if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 0) {
                    changeMonthOffset(-1); // 👈 向右拖：看上一個月
                } else {
                    changeMonthOffset(1);  // 👉 向左拖：看下一個月
                }
            }
        }

        function changeMonthOffset(offset) {
            const yearSelect = document.getElementById('filterYear');
            const monthSelect = document.getElementById('filterMonth');

            let currentYear = yearSelect.value === 'all' ? new Date().getFullYear() : parseInt(yearSelect.value);
            let currentMonth = monthSelect.value === 'all' ? (new Date().getMonth() + 1) : parseInt(monthSelect.value);

            currentMonth += offset;

            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear -= 1;
            } else if (currentMonth > 12) {
                currentMonth = 1;
                currentYear += 1;
            }

            const yearExists = Array.from(yearSelect.options).some(opt => opt.value == currentYear);
            if (!yearExists && yearSelect.value !== 'all') return;

            const listContainer = document.getElementById('diaryList');
            listContainer.classList.add('fade-out');

            setTimeout(() => {
                if (yearSelect.value !== 'all') yearSelect.value = currentYear;
                monthSelect.value = currentMonth.toString().padStart(2, '0');

                loadDiaries();
                listContainer.classList.remove('fade-out');
            }, 150);
        }

        function openWriterModal() {
            document.getElementById('diaryDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('diaryText').value = '';
            document.getElementById('writerModal').style.display = 'flex';
        }

        function updateTrashCount() {
            const trash = JSON.parse(localStorage.getItem('myDiariesTrash')) || [];
            document.getElementById('trashCount').textContent = trash.length;
        }

        function saveNewDiary() {
            const dateVal = document.getElementById('diaryDate').value;
            const contentVal = document.getElementById('diaryText').value.trim();

            if (!dateVal || !contentVal) {
                alert('請先寫點內容吧！');
                return;
            }

            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            diaries.push({ id: Date.now(), date: dateVal, content: contentVal });
            diaries.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            
            closeModal('writerModal');
            loadDiaries();
        }

        function loadDiaries() {
            const diaryListContainer = document.getElementById('diaryList');
            const diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            const targetYear = document.getElementById('filterYear').value;
            const targetMonth = document.getElementById('filterMonth').value;

            const filteredDiaries = diaries.filter(diary => {
                const d = new Date(diary.date);
                const yearMatch = (targetYear === 'all') || (d.getFullYear().toString() === targetYear);
                const monthMatch = (targetMonth === 'all') || ((d.getMonth() + 1).toString().padStart(2, '0') === targetMonth);
                return yearMatch && monthMatch;
            });

            if (filteredDiaries.length === 0) {
                diaryListContainer.innerHTML = '<div class="no-data" style="min-height: 200px; display: flex; align-items: center; justify-content: center;">暫無日記。</div>';
                return;
            }

            diaryListContainer.innerHTML = filteredDiaries.map(diary => {
                const lines = diary.content.split('\n');
                const title = lines[0];
                const restContent = lines.slice(1).join('\n');
                const dateObj = new Date(diary.date);
                const monthDay = `${(dateObj.getMonth() + 1).toString().padStart(2, '0')}/${dateObj.getDate().toString().padStart(2, '0')}`;

                return `
                    <div class="diary-item">
                        <div class="diary-left" onclick="if(!hasDragged) openDiaryModal(${diary.id})">
                            <div class="diary-item-date">${monthDay}</div>
                            <div class="diary-item-year">${dateObj.getFullYear()}</div>
                        </div>
                        <div class="diary-right" onclick="if(!hasDragged) openDiaryModal(${diary.id})">
                            <div class="diary-title">${escapeHTML(title)}</div>
                            <div class="diary-text">${escapeHTML(restContent)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDiaryModal(id) {
            targetDiaryId = id;
            const diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            const target = diaries.find(item => item.id === id);
            if (!target) return;

            const lines = target.content.split('\n');
            document.getElementById('viewDate').textContent = target.date.replace(/-/g, ' . ');
            document.getElementById('viewTitle').textContent = lines[0];
            document.getElementById('viewText').textContent = lines.slice(1).join('\n');

            document.getElementById('editModalDate').value = target.date;
            document.getElementById('editModalText').value = target.content;

            switchModalToView();
            document.getElementById('diaryModal').style.display = 'flex';
        }

        function openTrashModal() {
            const trashList = document.getElementById('trashList');
            const trash = JSON.parse(localStorage.getItem('myDiariesTrash')) || [];

            if (trash.length === 0) {
                trashList.innerHTML = '<div style="text-align:center; color:var(--hint-text); padding:30px 0; font-size:13px;">回收桶空空如也</div>';
            } else {
                trashList.innerHTML = trash.map(item => {
                    const title = item.content.split('\n')[0];
                    return `
                        <div class="trash-item">
                            <div class="trash-info">
                                <div class="trash-title">${escapeHTML(title)}</div>
                                <div class="trash-date">${item.date}</div>
                            </div>
                            <div class="trash-actions">
                                <button class="action-link" style="color:#424242;" onclick="restoreDiary(${item.id})">還原</button>
                                <button class="action-link link-delete" onclick="deletePermanently(${item.id})">清除</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            document.getElementById('trashModal').style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function switchModalToEdit() {
            document.getElementById('modeView').style.display = 'none';
            document.getElementById('viewActions').style.display = 'none';
            document.getElementById('modeEdit').style.display = 'block';
            document.getElementById('editActions').style.display = 'flex';
        }

        function switchModalToView() {
            document.getElementById('modeEdit').style.display = 'none';
            document.getElementById('editActions').style.display = 'none';
            document.getElementById('modeView').style.display = 'block';
            document.getElementById('viewActions').style.display = 'flex';
        }

        function handleModalUpdate() {
            const newDate = document.getElementById('editModalDate').value;
            const newContent = document.getElementById('editModalText').value.trim();

            if (!newDate || !newContent) return;

            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            diaries = diaries.map(item => {
                if (item.id === targetDiaryId) {
                    item.date = newDate;
                    item.content = newContent;
                }
                return item;
            });

            diaries.sort((a, b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            
            loadDiaries();
            openDiaryModal(targetDiaryId); 
        }

        function handleModalDelete() {
            moveToTrash(targetDiaryId);
            closeModal('diaryModal');
        }

        function moveToTrash(id) {
            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            let trash = JSON.parse(localStorage.getItem('myDiariesTrash')) || [];

            const targetIndex = diaries.findIndex(item => item.id === id);
            if (targetIndex === -1) return;

            const [removed] = diaries.splice(targetIndex, 1);
            trash.unshift(removed);

            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            localStorage.setItem('myDiariesTrash', JSON.stringify(trash));

            loadDiaries();
            updateTrashCount();
        }

        function restoreDiary(id) {
            let diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            let trash = JSON.parse(localStorage.getItem('myDiariesTrash')) || [];

            const targetIndex = trash.findIndex(item => item.id === id);
            if (targetIndex === -1) return;

            const [restored] = trash.splice(targetIndex, 1);
            diaries.push(restored);
            diaries.sort((a, b) => new Date(b.date) - new Date(a.date));

            localStorage.setItem('myDiaries', JSON.stringify(diaries));
            localStorage.setItem('myDiariesTrash', JSON.stringify(trash));

            loadDiaries();
            updateTrashCount();
            openTrashModal(); 
        }

        function deletePermanently(id) {
            if (confirm('這將永久刪除此日記且無法復原，確定要清除嗎？')) {
                let trash = JSON.parse(localStorage.getItem('myDiariesTrash')) || [];
                trash = trash.filter(item => item.id !== id);
                localStorage.setItem('myDiariesTrash', JSON.stringify(trash));

                updateTrashCount();
                openTrashModal();
            }
        }

        function exportToExcel() {
            const diaries = JSON.parse(localStorage.getItem('myDiaries')) || [];
            if (diaries.length === 0) {
                alert("沒有日記可以匯出！");
                return;
            }

            let csvContent = "Date,Title,Content\n";
            
            diaries.forEach(item => {
                const lines = item.content.split('\n');
                const title = lines[0].replace(/"/g, '""');
                const content = lines.slice(1).join('\n').replace(/"/g, '""');
                csvContent += `"${item.date}","${title}","${content}"\n`;
            });

            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
            
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "mono_diary_backup.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
